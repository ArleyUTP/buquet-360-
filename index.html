<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bouquet Personalizado 360°</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --cream:#faf7f2;--warm-white:#fff9f5;--border:#e8e0d6;
      --text-dark:#2a2018;--text-mid:#7a6a58;--text-light:#b0a090;--accent:#c8a882;
    }
    html,body{height:100%;background:var(--cream);font-family:'Jost',sans-serif;color:var(--text-dark)}
    header{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 2rem;border-bottom:.5px solid var(--border);background:var(--warm-white)}
    .brand{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:600;letter-spacing:.04em}
    .brand span{color:var(--accent)}
    .header-tag{font-size:11px;color:var(--text-light);letter-spacing:.12em;text-transform:uppercase}
    .app{display:grid;grid-template-columns:1fr 320px;height:calc(100vh - 58px)}
    .viewer-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cream);padding:2rem;position:relative}
    #three-canvas{width:100%;max-width:500px;height:460px;border-radius:20px;display:block;touch-action:none}
    .viewer-hint{margin-top:14px;font-size:12px;color:var(--text-light);letter-spacing:.06em;display:flex;align-items:center;gap:6px}
    .viewer-hint svg{width:14px;height:14px;opacity:.5}
    .badge{position:absolute;top:2rem;left:50%;transform:translateX(-50%);background:var(--warm-white);border:.5px solid var(--border);border-radius:999px;padding:4px 16px;font-size:12px;font-weight:500;color:var(--text-mid);letter-spacing:.08em;transition:all .3s;white-space:nowrap;pointer-events:none;z-index:2}
    .panel{background:var(--warm-white);border-left:.5px solid var(--border);padding:2rem 1.5rem;display:flex;flex-direction:column;gap:1.5rem;overflow-y:auto}
    .panel-title{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:600;line-height:1.2}
    .panel-subtitle{font-size:12px;color:var(--text-light);margin-top:4px;letter-spacing:.06em}
    .section{display:flex;flex-direction:column;gap:8px}
    .section-label{font-size:10px;font-weight:500;color:var(--text-light);letter-spacing:.14em;text-transform:uppercase}
    .swatch-grid{display:flex;gap:10px;flex-wrap:wrap}
    .swatch{width:38px;height:38px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;outline:1.5px solid transparent;outline-offset:3px;transition:transform .18s,outline-color .18s}
    .swatch:hover{transform:scale(1.1)}
    .swatch.active{outline-color:var(--text-dark)}
    .option-list{display:flex;flex-direction:column;gap:6px}
    .opt-btn{background:transparent;border:.5px solid var(--border);border-radius:10px;padding:9px 14px;font-family:'Jost',sans-serif;font-size:13px;color:var(--text-dark);cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;transition:background .15s,border-color .15s}
    .opt-btn:hover{background:var(--cream)}
    .opt-btn.active{border-color:var(--text-dark);border-width:1.5px;font-weight:500}
    .opt-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
    .size-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .size-btn{background:transparent;border:.5px solid var(--border);border-radius:10px;padding:10px 4px;font-family:'Jost',sans-serif;font-size:12px;color:var(--text-mid);cursor:pointer;text-align:center;transition:background .15s,border-color .15s,color .15s}
    .size-btn:hover{background:var(--cream)}
    .size-btn.active{border-color:var(--text-dark);border-width:1.5px;color:var(--text-dark);font-weight:500}
    .size-btn small{display:block;font-size:10px;color:var(--text-light);margin-top:2px}
    .price-block{margin-top:auto;padding-top:1.5rem;border-top:.5px solid var(--border)}
    .price-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
    .price-label{font-size:12px;color:var(--text-light);letter-spacing:.06em}
    .price-val{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:600}
    .cta-btn{width:100%;padding:14px;background:var(--text-dark);color:var(--cream);border:none;border-radius:12px;font-family:'Jost',sans-serif;font-size:13px;font-weight:500;letter-spacing:.08em;cursor:pointer;transition:opacity .15s}
    .cta-btn:hover{opacity:.85}
    .note{font-size:11px;color:var(--text-light);text-align:center;margin-top:10px;letter-spacing:.04em}
    .loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;opacity:1;transition:opacity .4s;z-index:3}
    .loader.hidden{opacity:0;pointer-events:none}
    .loader-ring{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loader-text{font-size:12px;color:var(--text-light);letter-spacing:.08em}
    #debug{position:absolute;bottom:8px;left:8px;font-size:10px;color:var(--text-light);background:rgba(255,255,255,.7);padding:4px 8px;border-radius:6px;max-width:340px;word-break:break-all;z-index:10}
    @media(max-width:700px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto}.viewer-wrap{height:380px}#three-canvas{height:380px}.panel{border-left:none;border-top:.5px solid var(--border)}}
  </style>
</head>
<body>
<header>
  <div class="brand">Flora<span>&</span>Co</div>
  <div class="header-tag">Personalizador 360°</div>
</header>

<div class="app">
  <div class="viewer-wrap">
    <div class="loader" id="loader">
      <div class="loader-ring"></div>
      <span class="loader-text" id="loaderText">Cargando bouquet...</span>
    </div>
    <div class="badge" id="colorBadge">Rosa Roja</div>
    <canvas id="three-canvas"></canvas>
    <p class="viewer-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg>
      Arrastra para rotar · Scroll para zoom
    </p>
    <div id="debug"></div>
  </div>

  <div class="panel">
    <div>
      <h1 class="panel-title">Bouquet<br/>de Rosas</h1>
      <p class="panel-subtitle">Personaliza cada detalle</p>
    </div>

    <!-- ROSAS -->
    <div class="section">
      <span class="section-label">Color de rosas</span>
      <div class="swatch-grid" id="swatchRosas">
        <div class="swatch active" style="background:#c0233a"        onclick="setColor('rosas',this,'Rosa Roja','#c0233a')"     title="Roja"></div>
        <div class="swatch"        style="background:#e8708a"        onclick="setColor('rosas',this,'Rosa Clásica','#e8708a')"  title="Rosa"></div>
        <div class="swatch"        style="background:#c2185b"        onclick="setColor('rosas',this,'Rosa Fucsia','#c2185b')"   title="Fucsia"></div>
        <div class="swatch"        style="background:#e86030"        onclick="setColor('rosas',this,'Rosa Naranja','#e86030')"  title="Naranja"></div>
        <div class="swatch"        style="background:#f5ede8;border-color:#ddd" onclick="setColor('rosas',this,'Rosa Blanca','#f5ede8')" title="Blanca"></div>
      </div>
    </div>

    <!-- LISTÓN -->
    <div class="section">
      <span class="section-label">Color de listón</span>
      <div class="swatch-grid" id="swatchListon">
        <div class="swatch active" style="background:#f5ede8;border-color:#ddd" onclick="setColor('liston',this,'Blanco','#f5ede8')"      title="Blanco"></div>
        <div class="swatch"        style="background:#f5e6c8;border-color:#ddd" onclick="setColor('liston',this,'Champagne','#f5e6c8')"   title="Champagne"></div>
        <div class="swatch"        style="background:#c0233a"                   onclick="setColor('liston',this,'Rojo','#c0233a')"        title="Rojo"></div>
        <div class="swatch"        style="background:#d4b896"                   onclick="setColor('liston',this,'Arena','#d4b896')"       title="Arena"></div>
        <div class="swatch"        style="background:#7a2e3a"                   onclick="setColor('liston',this,'Borgoña','#7a2e3a')"     title="Borgoña"></div>
      </div>
    </div>

    <!-- PAPEL ENVOLTURA -->
    <div class="section">
      <span class="section-label">Papel de envoltura</span>
      <div class="option-list" id="wrapList">
        <button class="opt-btn active" onclick="setColor('papel',this,'Kraft natural','#d4b896')"><span class="opt-dot" style="background:#d4b896"></span>Kraft natural</button>
        <button class="opt-btn"        onclick="setColor('papel',this,'Verde sage','#c8d8c0')">  <span class="opt-dot" style="background:#c8d8c0"></span>Verde sage</button>
        <button class="opt-btn"        onclick="setColor('papel',this,'Lila suave','#d4c0d8')">  <span class="opt-dot" style="background:#d4c0d8"></span>Lila suave</button>
        <button class="opt-btn"        onclick="setColor('papel',this,'Blanco','#f0f0f0')">       <span class="opt-dot" style="background:#f0f0f0;border:1px solid #ddd"></span>Blanco elegante</button>
        <button class="opt-btn"        onclick="setColor('papel',this,'Rosa pastel','#f0c8d0')"> <span class="opt-dot" style="background:#f0c8d0"></span>Rosa pastel</button>
      </div>
    </div>

    <!-- TAMAÑO -->
    <div class="section">
      <span class="section-label">Tamaño</span>
      <div class="size-grid">
        <button class="size-btn"        onclick="setSize(this,55,'S')">S<small>12 rosas</small></button>
        <button class="size-btn active" onclick="setSize(this,85,'M')">M<small>24 rosas</small></button>
        <button class="size-btn"        onclick="setSize(this,130,'L')">L<small>36 rosas</small></button>
      </div>
    </div>

    <div class="price-block">
      <div class="price-row">
        <span class="price-label">Total estimado</span>
        <span class="price-val" id="priceVal">S/ 85</span>
      </div>
      <button class="cta-btn" onclick="addToCart()">Agregar al pedido</button>
      <p class="note" id="configNote">Rosa Roja · Listón Blanco · Kraft natural · Talla M</p>
    </div>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';


// ── DOM refs ─────────────────────────────────────────────────────────────────
const canvas     = document.getElementById('three-canvas');
const loaderEl   = document.getElementById('loader');
const loaderText = document.getElementById('loaderText');
const colorBadge = document.getElementById('colorBadge');
const priceVal   = document.getElementById('priceVal');
const configNote = document.getElementById('configNote');
const debugEl    = document.getElementById('debug');

// ── Material name mapping (must match GLB export names) ──────────────────────
const MAT_NAMES = {
  rosas:  'rosas_mat',
  liston: 'liston_mat',
  papel:  'papel_envoltura_mat',
  tallos: 'tallos_hojas_mat',
};

// slot → array of THREE.Material
const matMap = {};

// ── THREE setup ──────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfaf7f2);

// ── Environment & lights ─────────────────────────────────────────────────────
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment()).texture;

// Key light — frontal-left, warmer
const keyLight = new THREE.DirectionalLight(0xffeedd, 1.8);
keyLight.position.set(2, 3, 4);
scene.add(keyLight);

// Fill light — right side, cooler, softer
const fillLight = new THREE.DirectionalLight(0xddddff, 0.8);
fillLight.position.set(-3, 1, 2);
scene.add(fillLight);

// Rim light — back-top, gives edge definition
const rimLight = new THREE.DirectionalLight(0xffffff, 0.5);
rimLight.position.set(0, 3, -4);
scene.add(rimLight);

const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
camera.position.set(0, 1.2, 5);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 2.5;
controls.minDistance = 1.5;
controls.maxDistance = 12;
controls.enablePan = false;
controls.update();

// ── Resize handler ───────────────────────────────────────────────────────────
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
resize();
window.addEventListener('resize', resize);

// ── Animation loop ───────────────────────────────────────────────────────────
(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();

// ── Color helpers ────────────────────────────────────────────────────────────
function hexToLinear(hex) {
  const c = new THREE.Color(hex);
  c.convertSRGBToLinear();
  return c;
}

function setMatColor(slot, hex) {
  const mats = matMap[slot];
  if (!mats || !mats.length) {
    debugEl.textContent = `⚠ Material no encontrado: "${slot}". Revisar MAT_NAMES vs GLB.`;
    return;
  }
  const col = hexToLinear(hex);
  for (const m of mats) {
    m.color.copy(col);
    m.needsUpdate = true;
  }
}

// ── Load GLB ─────────────────────────────────────────────────────────────────
const GLB_URL = 'https://raw.githubusercontent.com/ArleyUTP/buquet-360-/main/rose_bouquet_3d.glb';

new GLTFLoader().load(
  GLB_URL,
  (gltf) => {
    const model = gltf.scene;
    scene.add(model);

    // Build material map by name
    let totalMats = 0;
    model.traverse(child => {
      if (!child.isMesh) return;
      const mats = Array.isArray(child.material) ? child.material : [child.material];
      for (const mat of mats) {
        if (!mat || !mat.name) continue;
        const key = mat.name.toLowerCase().trim();
        for (const [slot, matName] of Object.entries(MAT_NAMES)) {
          if (key === matName.toLowerCase()) {
            if (!matMap[slot]) matMap[slot] = [];
            if (!matMap[slot].includes(mat)) {
              matMap[slot].push(mat);
              totalMats++;
            }
          }
        }
      }
    });

    // Debug
    const found = Object.keys(matMap);
    debugEl.textContent = `Materiales: ${found.length ? found.join(', ') : 'NINGUNO — revisar MAT_NAMES vs GLB'}`;

    // Remove baseColorTexture from colorizable materials (GLB has baked texture)
    // so material.color controls the full hue without multiplication.
    const colorizable = ['rosas', 'liston', 'papel'];
    for (const slot of colorizable) {
      const mats = matMap[slot];
      if (!mats) continue;
      for (const m of mats) {
        if (m.map) {
          m.map = null;
          m.needsUpdate = true;
        }
      }
    }

    // Apply default colors (using material.color for solid-color materials)
    setMatColor('rosas',  '#c0233a');
    setMatColor('liston', '#f5ede8');
    setMatColor('papel',  '#d4b896');
    // tallos keeps its natural texture color

    // Auto-fit camera to model bounds
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size   = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    camera.position.set(center.x, center.y + maxDim * 0.3, maxDim * 2.2);
    controls.target.copy(center);
    controls.update();

    loaderEl.classList.add('hidden');
  },
  (xhr) => {
    const pct = Math.round(xhr.loaded / (xhr.total || 1) * 100);
    loaderText.textContent = `Cargando bouquet... ${pct}%`;
  },
  (err) => {
    loaderText.textContent = 'Error al cargar el modelo';
    debugEl.textContent = '❌ ' + (err.message || err);
    console.error(err);
  }
);

// ── State ────────────────────────────────────────────────────────────────────
const state = { roseName:'Rosa Roja', listonName:'Blanco', papelName:'Kraft natural', size:'M', price:85 };

function updateUI() {
  colorBadge.textContent = state.roseName;
  configNote.textContent = `${state.roseName} · Listón ${state.listonName} · ${state.papelName} · Talla ${state.size}`;
}

// ── Unified color handler ────────────────────────────────────────────────────
window.setColor = (slot, el, name, hex) => {
  const parent = el.parentElement;
  if (parent) {
    parent.querySelectorAll('.active').forEach(s => s.classList.remove('active'));
  }
  el.classList.add('active');

  if (slot === 'rosas')  { state.roseName  = name; }
  if (slot === 'liston') { state.listonName = name; }
  if (slot === 'papel')  { state.papelName  = name; }

  setMatColor(slot, hex);
  updateUI();
};

window.setSize = (el, price, size) => {
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  state.price = price;
  state.size = size;
  priceVal.textContent = 'S/ ' + price;
  updateUI();
};

window.addToCart = () => {
  alert(`¡Pedido agregado!\n• Rosas: ${state.roseName}\n• Listón: ${state.listonName}\n• Envoltura: ${state.papelName}\n• Talla: ${state.size}\n• Precio: S/ ${state.price}`);
};
</script>
</body>
</html>
